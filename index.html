<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>AONE Princess Shop</title>
<style>
  :root {
    --primary-pink: #FF80AB;
    --deep-pink: #FF4081;
    --lavender: #E1BEE7;
    --gold: #FFD700;
    --text-color: #4A148C;
  }
  * { box-sizing: border-box; user-select: none; margin: 0; padding: 0; font-family: 'Hiragino Maru Gothic ProN', sans-serif; }
  body { background: radial-gradient(circle, #FFF5F8 0%, #F8BBD0 100%); overflow: hidden; width: 100vw; height: 100vh; color: var(--text-color); }
  #fxCanvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 999; }
  .screen { display: none; width: 100vw; height: 100vh; padding: 12px; flex-direction: column; justify-content: space-between; }
  .screen.active { display: flex; }

  /* ヘッダー */
  .header {
    display: flex; justify-content: space-between; align-items: center;
    background: #FFF; border: 3px solid var(--primary-pink); border-radius: 18px; padding: 8px 16px;
    box-shadow: 0 4px 10px rgba(255, 128, 171, 0.2);
  }
  .header h1 { font-size: 24px; color: var(--deep-pink); }

  /* ボタン */
  .btn {
    background: linear-gradient(180deg, #FFF 0%, #FF80AB 100%);
    color: #FFF; border: 2px solid #FFF; border-radius: 20px;
    padding: 8px 16px; font-size: 16px; font-weight: bold; cursor: pointer;
    box-shadow: 0 4px 8px rgba(0,0,0,0.1); display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  }
  .btn:active { transform: scale(0.95); }
  .btn-gold { background: linear-gradient(180deg, #FFF9C4 0%, #FFD54F 100%); color: #5D4037; }
  .btn-blue { background: linear-gradient(180deg, #E1F5FE 0%, #4FC3F7 100%); color: #01579B; }
  .btn-green { background: linear-gradient(180deg, #E8F5E9 0%, #66BB6A 100%); color: #1B5E20; }
  .btn-red { background: linear-gradient(180deg, #FFEBEE 0%, #E53935 100%); color: #FFF; }

  /* メイン画面レイアウト */
  .main-body { display: flex; width: 100%; height: calc(100vh - 80px); gap: 12px; margin-top: 8px; }

  /* 左：商品カタログ＆バーコードカメラ起動 */
  .catalog-panel {
    flex: 1.4; background: rgba(255, 255, 255, 0.9); border-radius: 20px;
    border: 3px solid var(--primary-pink); padding: 10px; display: flex; flex-direction: column;
  }
  .catalog-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
  .item-grid {
    flex: 1; overflow-y: auto; display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px;
  }
  .item-card {
    background: #FFF; border: 2px solid #F8BBD0; border-radius: 14px;
    padding: 6px; display: flex; flex-direction: column; align-items: center; justify-content: center;
    cursor: pointer; box-shadow: 0 3px 6px rgba(0,0,0,0.05);
  }
  .item-card:active { transform: scale(0.92); }
  .item-card .icon { font-size: 34px; }
  .item-card .name { font-size: 13px; font-weight: bold; margin-top: 2px; }
  .item-card .price { font-size: 14px; font-weight: 900; color: var(--deep-pink); }

  /* 右：買い物かご */
  .cart-panel {
    flex: 1; background: rgba(255, 255, 255, 0.95); border-radius: 20px;
    border: 3px solid var(--primary-pink); display: flex; flex-direction: column; padding: 12px;
  }
  .cart-list { flex: 1; overflow-y: auto; margin: 6px 0; display: flex; flex-direction: column; gap: 6px; }
  .cart-item {
    display: flex; justify-content: space-between; align-items: center;
    background: #FFF0F5; padding: 6px 10px; border-radius: 10px; border: 1px solid #F8BBD0; font-size: 14px;
  }
  .cart-total-box {
    background: #FCE4EC; border-radius: 14px; padding: 10px 14px;
    display: flex; justify-content: space-between; align-items: center; font-weight: bold; color: #880E4F;
  }

  /* お支払い方法選択モーダル */
  .modal-overlay {
    position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
    background: rgba(0,0,0,0.7); display: none; align-items: center; justify-content: center; z-index: 1000;
  }
  .modal-box {
    background: #FFF; border-radius: 24px; border: 4px solid var(--primary-pink);
    padding: 24px; width: 500px; max-width: 90%; text-align: center;
  }
  .pay-choice-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin: 20px 0; }
  .pay-choice-btn {
    height: 110px; flex-direction: column; font-size: 17px; border-radius: 18px; gap: 8px;
  }

  /* カメラリーダーモーダル */
  .camera-box {
    width: 280px; height: 240px; margin: 12px auto; border-radius: 16px;
    overflow: hidden; border: 3px solid var(--gold); position: relative; background: #000;
  }
  #scanVideo { width: 100%; height: 100%; object-fit: cover; }
  .scan-guide {
    position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
    width: 180px; height: 180px; border: 3px dashed #FF4081; border-radius: 16px;
  }

  /* 印刷シート */
  #printSheetModal {
    position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
    background: #FFF; display: none; z-index: 2000; overflow-y: auto; padding: 16px;
  }
  .print-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-top: 10px; }
  .print-card {
    border: 2px dashed #FF4081; border-radius: 12px; padding: 8px; text-align: center;
    display: flex; flex-direction: column; align-items: center; background: #FFF5F8;
  }
  @media print {
    .no-print { display: none !important; }
    #printSheetModal { position: static; display: block !important; padding: 0; }
  }
</style>
<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
</head>
<body>

<canvas id="fxCanvas"></canvas>

<!-- 1. メインレジ画面 -->
<div id="cashierScreen" class="screen active">
  <div class="header">
    <h1>👑 AONE Princess Shop 💖</h1>
    <div style="display: flex; gap: 8px;">
      <button class="btn btn-gold" onclick="openPrintSheet()">🖨️ いんさつシート</button>
      <button class="btn btn-red" onclick="clearCart()">🗑️ クリア</button>
    </div>
  </div>

  <div class="main-body">
    <!-- 左：商品カタログ ＆ バーコードスキャンボタン -->
    <div class="catalog-panel">
      <div class="catalog-top">
        <span style="font-weight: bold; color: var(--deep-pink);">🛍️ しょうひんをえらんでね</span>
        <button class="btn btn-blue" onclick="startItemScan()">📷 バーコードをピッ！</button>
      </div>
      <div class="item-grid" id="catalogList"></div>
    </div>

    <!-- 右：おかいものかご -->
    <div class="cart-panel">
      <h2 style="font-size: 18px; color: #880E4F;">🛒 かいものかご</h2>
      <div class="cart-list" id="cartList"></div>

      <div class="cart-total-box">
        <span>ごうけい</span>
        <span style="font-size: 28px; color: var(--deep-pink);">¥<span id="cartTotal">0</span></span>
      </div>

      <button class="btn btn-gold" style="font-size: 22px; padding: 12px; margin-top: 8px;" onclick="openPaySelectModal()">
        ✨ おかいけいにすすむ
      </button>
    </div>
  </div>
</div>

<!-- 2. 店員さんが選ぶ「お支払方法の選択」画面 -->
<div id="paySelectModal" class="modal-overlay">
  <div class="modal-box">
    <h2 style="color: var(--deep-pink); font-size: 24px;">「おしはらい ほうほうは？」</h2>
    <p style="color: #666; margin-top: 4px;">お客さんが言った方法をえらんでね！</p>

    <div class="pay-choice-grid">
      <!-- ① 現金 -->
      <button class="btn btn-green pay-choice-btn" onclick="startCashPay()">
        <span style="font-size: 32px;">💵</span>
        <span>げんきん</span>
      </button>

      <!-- ② クレジットカード -->
      <button class="btn btn-gold pay-choice-btn" onclick="startCardPay()">
        <span style="font-size: 32px;">💳</span>
        <span>AONEカード</span>
      </button>

      <!-- ③ QRコード決済 -->
      <button class="btn btn-blue pay-choice-btn" onclick="openQRBrandModal()">
        <span style="font-size: 32px;">📱</span>
        <span>QRコード決済</span>
      </button>
    </div>

    <button class="btn btn-red" onclick="closeModal('paySelectModal')">もどる</button>
  </div>
</div>

<!-- 3. QRコードブランド選択（d払い、PayPay、楽天ペイ） -->
<div id="qrBrandModal" class="modal-overlay">
  <div class="modal-box">
    <h2 style="color: var(--deep-pink);">どのQRコードで払いますか？</h2>
    <div class="pay-choice-grid">
      <button class="btn pay-choice-btn" style="background: linear-gradient(180deg, #E1F5FE, #0288D1); color:#FFF;" onclick="startQRScan('DMOBILE', 'ｄ払い')">
        <span style="font-size: 30px;">🔵</span>
        <span>ｄ払い</span>
      </button>
      <button class="btn pay-choice-btn" style="background: linear-gradient(180deg, #FFEBEE, #E53935); color:#FFF;" onclick="startQRScan('PAYPAY', 'PayPay')">
        <span style="font-size: 30px;">🔴</span>
        <span>PayPay</span>
      </button>
      <button class="btn pay-choice-btn" style="background: linear-gradient(180deg, #FFEBEE, #C62828); color:#FFF;" onclick="startQRScan('RAKUTEN', '楽天ペイ')">
        <span style="font-size: 30px;">🔴</span>
        <span>楽天ペイ</span>
      </button>
    </div>
    <button class="btn btn-red" onclick="closeModal('qrBrandModal'); openPaySelectModal();">もどる</button>
  </div>
</div>

<!-- 4. カメラ読み取り画面（商品バーコード / QRコード / カード 共通） -->
<div id="cameraModal" class="modal-overlay">
  <div class="modal-box">
    <h2 id="cameraTitle" style="color: var(--deep-pink);">📷 コードをうつしてね</h2>
    <div class="camera-box">
      <video id="scanVideo" playsinline autoplay muted></video>
      <div class="scan-guide"></div>
    </div>
    <p id="cameraHelp" style="font-size: 13px; color: #666; margin-bottom: 10px;"></p>
    <button class="btn btn-red" onclick="stopCamera()">やめる</button>
  </div>
</div>

<!-- 5. 現金お会計モーダル -->
<div id="cashModal" class="modal-overlay">
  <div class="modal-box">
    <h2 style="color: #2E7D32;">💵 げんきん おかいけい</h2>
    <div style="font-size: 24px; font-weight: bold; margin: 12px 0;">
      ごうけい: <span style="color: var(--deep-pink);">¥<span id="cashTotalDisp">0</span></span>
    </div>
    <div style="display: flex; gap: 8px; justify-content: center; margin: 16px 0;">
      <button class="btn btn-green" style="font-size: 18px; padding: 10px 20px;" onclick="finishCashPay(true)">
        ぴったり もらった！
      </button>
      <button class="btn btn-gold" style="font-size: 18px; padding: 10px 20px;" onclick="finishCashPay(false)">
        おおめにもらった (おつり)
      </button>
    </div>
    <button class="btn btn-red" onclick="closeModal('cashModal'); openPaySelectModal();">もどる</button>
  </div>
</div>

<!-- 6. お会計完了画面 -->
<div id="successScreen" class="screen" style="justify-content: center; align-items: center; gap: 16px;">
  <div style="font-size: 70px;">💖👑✨</div>
  <h1 style="font-size: 38px; color: var(--deep-pink);">おかいあげ ありがとう！</h1>
  <div id="successDetails" style="font-size: 22px; font-weight: bold; color: #880E4F; text-align: center;"></div>
  <button class="btn btn-gold" style="font-size: 22px; padding: 12px 30px;" onclick="nextCustomer()">つぎのおきゃくさま 🌸</button>
</div>

<!-- 7. 印刷シート（自作値札 ＆ 各種決済QR） -->
<div id="printSheetModal">
  <div class="no-print" style="position: sticky; top:0; background:#FFF; padding:10px; border-bottom:1px solid #CCC; display:flex; justify-content:space-between;">
    <h3>🖨️ A4 印刷シート（バーコード＆決済カード）</h3>
    <div>
      <button class="btn btn-gold" onclick="window.print()">印刷する</button>
      <button class="btn btn-red" onclick="closeModal('printSheetModal')">とじる</button>
    </div>
  </div>
  <div style="max-width: 800px; margin: 0 auto; padding: 16px;">
    <h4 style="color: var(--deep-pink);">💳 お支払い用カード＆QR</h4>
    <div class="print-grid">
      <div class="print-card" style="background:#FFF9C4; border: 3px solid #FFB300;">
        <strong>👑 AONE VIP CARD</strong>
        <div id="print_card_aone" style="margin:6px 0;"></div>
        <span style="font-size: 11px;">クレジットカード</span>
      </div>
      <div class="print-card" style="border: 3px solid #0288D1;">
        <strong style="color:#0288D1;">ｄ払い</strong>
        <div id="print_qr_dmobile" style="margin:6px 0;"></div>
      </div>
      <div class="print-card" style="border: 3px solid #E53935;">
        <strong style="color:red;">PayPay</strong>
        <div id="print_qr_paypay" style="margin:6px 0;"></div>
      </div>
      <div class="print-card" style="border: 3px solid #C62828;">
        <strong style="color:#C62828;">楽天ペイ</strong>
        <div id="print_qr_rakuten" style="margin:6px 0;"></div>
      </div>
    </div>

    <h4 style="color: var(--deep-pink); margin-top: 16px;">🏷️ 商品ねふだバーコード（切り取っておもちゃに貼ってね）</h4>
    <div class="print-grid" id="productPrintGrid"></div>
  </div>
</div>

<script>
// 商品データ
const PRODUCTS = [
  { code: 'ITEM_TIARA',  name: 'きらきらティアラ', price: 1200, icon: '👑' },
  { code: 'ITEM_STICK',  name: 'まほうのステッキ', price: 980,  icon: '🪄' },
  { code: 'ITEM_RING',   name: 'ルビーのゆびわ',   price: 500,  icon: '💍' },
  { code: 'ITEM_SHOES',  name: 'ガラスのくつ',     price: 2500, icon: '👠' },
  { code: 'ITEM_DRESS',  name: 'ピンクドレス',     price: 3800, icon: '👗' },
  { code: 'ITEM_RIBBON', name: 'リボンカチューシャ', price: 650, icon: '🎀' }
];

let cart = [];
let scanMode = null; // 'ITEM', 'CARD', 'QR'
let expectedQR = null;
let currentMethodName = '';
let scanStream = null;
let scanTimer = null;
let actx = null;

// 音
function beep(freq, duration) {
  if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
  const osc = actx.createOscillator();
  const g = actx.createGain();
  osc.frequency.value = freq;
  g.gain.setValueAtTime(0.2, actx.currentTime);
  g.gain.exponentialRampToValueAtTime(0.01, actx.currentTime + duration);
  osc.connect(g); g.connect(actx.destination);
  osc.start(); osc.stop(actx.currentTime + duration);
}
function playCashSound() { beep(523, 0.1); setTimeout(() => beep(1046, 0.2), 100); }
function playFanfare() { [523, 659, 784, 1046].forEach((f, i) => setTimeout(() => beep(f, 0.25), i * 90)); }

// カタログ表示
function renderCatalog() {
  const container = document.getElementById('catalogList');
  container.innerHTML = '';
  PRODUCTS.forEach(p => {
    const card = document.createElement('div');
    card.className = 'item-card';
    card.innerHTML = `<span class="icon">${p.icon}</span><span class="name">${p.name}</span><span class="price">¥${p.price}</span>`;
    card.onclick = () => addToCart(p);
    container.appendChild(card);
  });
}

function addToCart(item) {
  beep(1800, 0.08); // ピピッ！
  const exist = cart.find(c => c.code === item.code);
  if (exist) exist.qty += 1;
  else cart.push({ ...item, qty: 1 });
  renderCart();
  emitGlitter(window.innerWidth * 0.7, window.innerHeight * 0.5, 15);
}

function renderCart() {
  const list = document.getElementById('cartList');
  list.innerHTML = '';
  let total = 0;
  cart.forEach(item => {
    const sub = item.price * item.qty;
    total += sub;
    const div = document.createElement('div');
    div.className = 'cart-item';
    div.innerHTML = `<span>${item.icon} ${item.name} × ${item.qty}</span><strong>¥${sub}</strong>`;
    list.appendChild(div);
  });
  document.getElementById('cartTotal').textContent = total.toLocaleString();
}

function clearCart() { cart = []; renderCart(); }

// --- お支払い選択 ---
function openPaySelectModal() {
  if (cart.length === 0) { alert('かいものかごに しょうひんを入れてね！'); return; }
  document.getElementById('paySelectModal').style.display = 'flex';
}
function openQRBrandModal() {
  closeModal('paySelectModal');
  document.getElementById('qrBrandModal').style.display = 'flex';
}
function closeModal(id) { document.getElementById(id).style.display = 'none'; }

// ① 現金
function startCashPay() {
  closeModal('paySelectModal');
  let total = cart.reduce((s, i) => s + (i.price * i.qty), 0);
  document.getElementById('cashTotalDisp').textContent = total.toLocaleString();
  document.getElementById('cashModal').style.display = 'flex';
}
function finishCashPay(isExact) {
  closeModal('cashModal');
  playCashSound();
  let total = cart.reduce((s, i) => s + (i.price * i.qty), 0);
  let msg = isExact ? `げんきん（ちょうど ¥${total}）` : `げんきん（おつりあり）`;
  setTimeout(() => completeCheckout(msg), 300);
}

// ② クレジットカード
function startCardPay() {
  closeModal('paySelectModal');
  scanMode = 'CARD';
  currentMethodName = '👑 AONE VIP CARD';
  openCamera('💳 AONE CARDをカメラにかざしてね', '印刷したVIPカードを枠に合わせてね！');
}

// ③ QRコード決済（d払い / PayPay / 楽天ペイ）
function startQRScan(brandKey, brandName) {
  closeModal('qrBrandModal');
  scanMode = 'QR';
  expectedQR = 'PLAY:' + brandKey;
  currentMethodName = brandName;
  openCamera(`📱 ${brandName}のコードをうつしてね`, `印刷した「${brandName}」のQRを枠に合わせてね！`);
}

// 商品バーコード読み取り
function startItemScan() {
  scanMode = 'ITEM';
  openCamera('🏷️ しょうひんのコードをうつしてね', '印刷した値札タグを枠に合わせてね！');
}

// --- カメラ起動 & QRスキャン ---
async function openCamera(title, help) {
  document.getElementById('cameraTitle').textContent = title;
  document.getElementById('cameraHelp').textContent = help;
  document.getElementById('cameraModal').style.display = 'flex';

  const video = document.getElementById('scanVideo');
  try {
    scanStream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: { ideal: "environment" } }
    });
    video.srcObject = scanStream;
    scanTimer = setInterval(scanTick, 200);
  } catch (e) {
    alert('カメラを開けませんでした');
    stopCamera();
  }
}

function stopCamera() {
  if (scanStream) { scanStream.getTracks().forEach(t => t.stop()); scanStream = null; }
  if (scanTimer) { clearInterval(scanTimer); scanTimer = null; }
  closeModal('cameraModal');
}

function scanTick() {
  const video = document.getElementById('scanVideo');
  if (video.readyState !== video.HAVE_ENOUGH_DATA) return;

  const cvs = document.createElement('canvas');
  cvs.width = video.videoWidth; cvs.height = video.videoHeight;
  const ctx = cvs.getContext('2d');
  ctx.drawImage(video, 0, 0, cvs.width, cvs.height);
  const imgData = ctx.getImageData(0, 0, cvs.width, cvs.height);

  const code = jsQR(imgData.data, imgData.width, imgData.height);
  if (code) {
    handleScannedResult(code.data);
  }
}

function handleScannedResult(val) {
  // ① 商品スキャン
  if (scanMode === 'ITEM') {
    const item = PRODUCTS.find(p => p.code === val);
    if (item) {
      stopCamera();
      addToCart(item);
    }
  }
  // ② カードスキャン
  else if (scanMode === 'CARD') {
    if (val === 'PLAY:AONECARD') {
      stopCamera();
      completeCheckout(currentMethodName);
    }
  }
  // ③ QR決済スキャン
  else if (scanMode === 'QR') {
    if (val === expectedQR) {
      stopCamera();
      completeCheckout(currentMethodName);
    } else if (val.startsWith('PLAY:')) {
      alert('ちがうQRコードです！えらんだQRをかざしてね');
    }
  }
}

function completeCheckout(method) {
  playFanfare();
  emitGlitter(window.innerWidth / 2, window.innerHeight / 2, 80);
  let total = cart.reduce((s, i) => s + (i.price * i.qty), 0);
  document.getElementById('successDetails').innerHTML = `
    おしはらい: <strong>${method}</strong><br>
    ごうけい: <strong style="color:#FF4081;font-size:32px;">¥${total.toLocaleString()}</strong>
  `;
  document.getElementById('cashierScreen').classList.remove('active');
  document.getElementById('successScreen').classList.add('active');
}

function nextCustomer() {
  cart = [];
  renderCart();
  document.getElementById('successScreen').classList.remove('active');
  document.getElementById('cashierScreen').classList.add('active');
}

// 印刷シート生成
function openPrintSheet() {
  document.getElementById('printSheetModal').style.display = 'block';
  // QR生成
  document.getElementById('print_card_aone').innerHTML = '';
  document.getElementById('print_qr_dmobile').innerHTML = '';
  document.getElementById('print_qr_paypay').innerHTML = '';
  document.getElementById('print_qr_rakuten').innerHTML = '';
  new QRCode(document.getElementById('print_card_aone'), { text: 'PLAY:AONECARD', width: 85, height: 85 });
  new QRCode(document.getElementById('print_qr_dmobile'), { text: 'PLAY:DMOBILE', width: 85, height: 85 });
  new QRCode(document.getElementById('print_qr_paypay'), { text: 'PLAY:PAYPAY', width: 85, height: 85 });
  new QRCode(document.getElementById('print_qr_rakuten'), { text: 'PLAY:RAKUTEN', width: 85, height: 85 });

  const grid = document.getElementById('productPrintGrid');
  grid.innerHTML = '';
  PRODUCTS.forEach(p => {
    const div = document.createElement('div');
    div.className = 'print-card';
    div.innerHTML = `<span>${p.icon}</span><strong>${p.name}</strong><span style="color:#FF4081;">¥${p.price}</span><div id="q_${p.code}"></div>`;
    grid.appendChild(div);
    setTimeout(() => new QRCode(document.getElementById(`q_${p.code}`), { text: p.code, width: 80, height: 80 }), 50);
  });
}

// キラキラ演出
const c = document.getElementById('fxCanvas'); const ctx = c.getContext('2d');
let pts = [];
function resize() { c.width = window.innerWidth; c.height = window.innerHeight; }
window.onresize = resize; resize();
function emitGlitter(x,y,cnt){ for(let i=0;i<cnt;i++) pts.push({x,y,vx:(Math.random()-0.5)*8,vy:(Math.random()-0.5)*8,color:['#FFD700','#FF80AB','#FFF'][Math.floor(Math.random()*3)],alpha:1}); }
function loop(){ ctx.clearRect(0,0,c.width,c.height); for(let i=pts.length-1;i>=0;i--){ let p=pts[i]; p.x+=p.vx; p.y+=p.vy; p.alpha-=0.03; ctx.fillStyle=p.color; ctx.globalAlpha=Math.max(0,p.alpha); ctx.beginPath(); ctx.arc(p.x,p.y,4,0,Math.PI*2); ctx.fill(); if(p.alpha<=0) pts.splice(i,1); } requestAnimationFrame(loop); }
loop();

window.onload = renderCatalog;
</script>
