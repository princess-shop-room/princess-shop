<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>AONE Princess Shop</title>
<style>
  :root {
    --primary-pink: #FF80AB;
    --deep-pink: #FF4081;
    --gold: #FFD700;
  }
  * { box-sizing: border-box; user-select: none; margin: 0; padding: 0; font-family: sans-serif; }
  body { background: radial-gradient(circle, #FFF5F8 0%, #F8BBD0 100%); overflow: hidden; width: 100vw; height: 100vh; }
  #fxCanvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 999; }
  .screen { display: none; width: 100vw; height: 100vh; padding: 12px; flex-direction: column; justify-content: space-between; }
  .screen.active { display: flex; }

  .header {
    display: flex; justify-content: space-between; align-items: center;
    background: #FFF; border: 3px solid var(--primary-pink); border-radius: 18px; padding: 8px 16px;
  }
  .header h1 { font-size: 24px; color: var(--deep-pink); }

  .btn {
    background: linear-gradient(180deg, #FFF 0%, #FF80AB 100%);
    color: #FFF; border: 2px solid #FFF; border-radius: 20px;
    padding: 8px 16px; font-size: 16px; font-weight: bold; cursor: pointer;
  }
  .btn:active { transform: scale(0.95); }
  .btn-gold { background: linear-gradient(180deg, #FFF9C4 0%, #FFD54F 100%); color: #5D4037; }
  .btn-red { background: linear-gradient(180deg, #FFEBEE 0%, #E53935 100%); color: #FFF; }

  .cashier-body { display: flex; width: 100%; height: calc(100vh - 85px); gap: 12px; margin-top: 8px; }

  /* バーコード読み取りカメラ枠 */
  .scanner-panel {
    flex: 1.3; background: #FFF; border-radius: 20px; border: 3px solid var(--primary-pink);
    padding: 10px; display: flex; flex-direction: column; align-items: center;
  }
  .camera-wrap {
    width: 100%; flex: 1; position: relative; border-radius: 14px; overflow: hidden; background: #000;
  }
  #scanVideo { width: 100%; height: 100%; object-fit: cover; }
  
  /* しましまバーコードを合わせやすい横長赤いレーザー枠 */
  .scan-guide {
    position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
    width: 260px; height: 140px; border: 3px dashed #FF4081; border-radius: 16px;
    box-shadow: 0 0 0 2000px rgba(0,0,0,0.35); pointer-events: none;
  }
  .scan-laser {
    position: absolute; top: 50%; left: 0; width: 100%; height: 3px;
    background: #FF0055; box-shadow: 0 0 8px #FF0055;
    animation: laserPulse 1.5s infinite alternate;
  }
  @keyframes laserPulse { 0% { opacity: 0.4; } 100% { opacity: 1; } }

  /* カート枠 */
  .cart-panel {
    flex: 1; background: rgba(255, 255, 255, 0.95); border-radius: 20px;
    border: 3px solid var(--primary-pink); display: flex; flex-direction: column; padding: 14px;
  }
  .cart-list { flex: 1; overflow-y: auto; margin: 8px 0; display: flex; flex-direction: column; gap: 6px; }
  .cart-item {
    display: flex; justify-content: space-between; align-items: center;
    background: #FFF0F5; padding: 6px 10px; border-radius: 10px; border: 1px solid #F8BBD0; font-size: 14px;
  }
  .cart-total-box {
    background: #FCE4EC; border-radius: 12px; padding: 8px 12px;
    display: flex; justify-content: space-between; align-items: center; font-weight: bold; color: #880E4F;
  }

  /* 印刷モーダル */
  #printSheetModal {
    position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
    background: #FFF; display: none; z-index: 2000; overflow-y: auto; padding: 16px;
  }
  .print-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-top: 12px; }
  .print-card {
    border: 2px dashed #FF4081; border-radius: 12px; padding: 8px; text-align: center;
    display: flex; flex-direction: column; align-items: center; background: #FFF5F8;
  }
  @media print {
    .no-print { display: none !important; }
    #printSheetModal { position: static; display: block !important; padding: 0; }
  }
</style>

<!-- 本物のバーコード（JAN）とQRコードの両方を同時に読める強力ライブラリ ZXing -->
<script src="https://unpkg.com/@zxing/library@latest"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
</head>
<body>

<canvas id="fxCanvas"></canvas>

<div id="cashierScreen" class="screen active">
  <div class="header">
    <h1>👑 AONE Princess Shop 💖</h1>
    <div style="display: flex; gap: 8px;">
      <button class="btn btn-gold" onclick="openPrintSheet()">🖨️ 決済カード印刷</button>
      <button class="btn btn-red" onclick="clearCart()">🗑️ クリア</button>
    </div>
  </div>

  <div class="cashier-body">
    <div class="scanner-panel">
      <div id="statusText" style="font-size: 15px; font-weight: bold; color: #D81B60; margin-bottom: 6px;">
        🔍 ジュースやお菓子のバーコードをうつしてね！
      </div>

      <div class="camera-wrap">
        <video id="scanVideo" playsinline autoplay muted></video>
        <div id="scanBox" class="scan-guide">
          <div class="scan-laser"></div>
        </div>
      </div>

      <div style="font-size: 13px; color: #555; margin-top: 8px; text-align: center;">
        赤い線のところに、<strong>黒白のバーコード（縦縞）</strong>を合わせてね！
      </div>
    </div>

    <div class="cart-panel">
      <h2 style="font-size: 18px; color: #880E4F;">🛍️ かいものかご</h2>
      <div class="cart-list" id="cartList"></div>
      <div class="cart-total-box">
        <span>ごうけい</span>
        <span style="font-size: 28px; color: var(--deep-pink);">¥<span id="cartTotal">0</span></span>
      </div>
      <div style="margin-top: 8px; font-size: 12px; text-align: center; color: #C2185B; background: #FFF0F5; padding: 6px; border-radius: 8px;">
        💡 最後に印刷したAONEカードやPayPayをかざすとお会計できるよ！
      </div>
    </div>
  </div>
</div>

<!-- 完了画面 -->
<div id="successScreen" class="screen" style="justify-content: center; align-items: center; gap: 16px;">
  <div style="font-size: 70px;">💖👑✨</div>
  <h1 style="font-size: 38px; color: var(--deep-pink);">おかいあげ ありがとう！</h1>
  <div id="successDetails" style="font-size: 22px; font-weight: bold; color: #880E4F; text-align: center;"></div>
  <button class="btn btn-gold" style="font-size: 22px; padding: 12px 30px;" onclick="nextCustomer()">つぎのおきゃくさま 🌸</button>
</div>

<!-- 印刷シート（決済用） -->
<div id="printSheetModal">
  <div class="no-print" style="position: sticky; top:0; background:#FFF; padding:10px; border-bottom:1px solid #CCC; display:flex; justify-content:space-between;">
    <h3>🖨️ お支払い用カード 印刷シート</h3>
    <div>
      <button class="btn btn-gold" onclick="window.print()">印刷する</button>
      <button class="btn btn-red" onclick="closePrintSheet()">とじる</button>
    </div>
  </div>
  <div style="max-width: 800px; margin: 0 auto; padding: 20px;">
    <p class="no-print" style="margin-bottom: 12px; color: #666;">
      これを印刷してハサミで切り、お会計のときにカメラにかざして遊んでね！
    </p>
    <div class="print-grid">
      <div class="print-card" style="background:#FFF9C4; border: 3px solid #FFB300;">
        <strong style="font-size: 18px;">👑 AONE VIP CARD</strong>
        <div id="print_card_aone" style="margin:8px 0;"></div>
        <span style="font-size: 12px; font-weight: bold;">専用クレジットカード</span>
      </div>
      <div class="print-card" style="border: 3px solid #E53935;">
        <strong style="color:red; font-size: 18px;">PayPayごっこ</strong>
        <div id="print_qr_paypay" style="margin:8px 0;"></div>
        <span style="font-size: 12px;">スマホ決済</span>
      </div>
      <div class="print-card" style="border: 3px solid #C62828;">
        <strong style="color:#C62828; font-size: 18px;">楽天ペイごっこ</strong>
        <div id="print_qr_rakuten" style="margin:8px 0;"></div>
        <span style="font-size: 12px;">スマホ決済</span>
      </div>
    </div>
  </div>
</div>

<script>
// 家にある本物のバーコードを読み取った時に自動で割り振られる可愛い商品リスト
const RANDOM_ITEMS = [
  { name: 'プリンセスジュース', price: 160, icon: '🧃' },
  { name: 'きらきらクッキー', price: 130, icon: '🍪' },
  { name: 'まほうのチョコレート', price: 210, icon: '🍫' },
  { name: 'いちごみるく', price: 150, icon: '🍓' },
  { name: 'プリンセスキャンディ', price: 90, icon: '🍬' },
  { name: 'フルーツゼリー', price: 180, icon: '🍮' },
  { name: 'ハートのアイス', price: 170, icon: '🍦' }
];

let scannedProductMap = {}; // 1度スキャンした商品の記憶
let cart = [];
let lastCode = '';
let lastTime = 0;
let isScanning = true;
let codeReader = null;

// 音声
let actx = null;
function beep(freq, duration) {
  if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
  const osc = actx.createOscillator();
  const g = actx.createGain();
  osc.frequency.value = freq;
  g.gain.setValueAtTime(0.25, actx.currentTime);
  g.gain.exponentialRampToValueAtTime(0.01, actx.currentTime + duration);
  osc.connect(g); g.connect(actx.destination);
  osc.start(); osc.stop(actx.currentTime + duration);
}

// 本物のバーコード＆QR両対応リーダーの開始
async function initBarcodeScanner() {
  const status = document.getElementById('statusText');
  
  try {
    // ZXingの複数フォーマット（EAN-13, EAN-8, QRなど）対応リーダー
    codeReader = new ZXing.BrowserMultiFormatReader();
    
    // カメラ取得（背面カメラ）
    const videoInputDevices = await codeReader.listVideoInputDevices();
    let selectedDeviceId = undefined;
    
    // 背面カメラを探す
    for (const dev of videoInputDevices) {
      if (dev.label.toLowerCase().includes('back') || dev.label.toLowerCase().includes('rear') || dev.label.toLowerCase().includes('environment')) {
        selectedDeviceId = dev.deviceId;
        break;
      }
    }
    if (!selectedDeviceId && videoInputDevices.length > 0) {
      selectedDeviceId = videoInputDevices[videoInputDevices.length - 1].deviceId;
    }

    status.textContent = '🟢 バーコードを赤い線にかざしてね！';

    // リアルタイム読み取りループ開始
    codeReader.decodeFromVideoDevice(selectedDeviceId, 'scanVideo', (result, err) => {
      if (result && isScanning) {
        onBarcodeDetected(result.getText());
      }
    });

  } catch (e) {
    status.textContent = '⚠️ カメラが開けません。「カメラを許可」してね';
  }
}

// バーコードまたはQRを読み取ったときの判定
function onBarcodeDetected(code) {
  const now = Date.now();
  // 連続誤読み取り防止（1.5秒間隔）
  if (code === lastCode && now - lastTime < 1500) return;
  lastCode = code;
  lastTime = now;

  // ① 決済用QRコードの場合
  if (code === 'PLAY:AONECARD' || code === 'PLAY:PAYPAY' || code === 'PLAY:RAKUTEN') {
    if (cart.length === 0) return;
    if (code === 'PLAY:AONECARD') {
      beep(1200, 0.2);
      completeCheckout('👑 AONE VIP CARD');
    } else if (code === 'PLAY:PAYPAY') {
      beep(1500, 0.15);
      completeCheckout('🔴 PayPayごっこ');
    } else if (code === 'PLAY:RAKUTEN') {
      beep(1500, 0.15);
      completeCheckout('🔴 楽天ペイごっこ');
    }
    return;
  }

  // ② 本物の商品のバーコード（しましま）の場合！
  beep(1900, 0.08); // 本物のレジの「ピッ！」

  // すでに登録されているかチェック。初スキャンの場合はランダム割り振り
  if (!scannedProductMap[code]) {
    const template = RANDOM_ITEMS[Object.keys(scannedProductMap).length % RANDOM_ITEMS.length];
    scannedProductMap[code] = { ...template };
  }
  const item = scannedProductMap[code];

  // カートに入れる
  const exist = cart.find(c => c.code === code);
  if (exist) {
    exist.qty += 1;
  } else {
    cart.push({ ...item, code: code, qty: 1 });
  }

  renderCart();
}

function renderCart() {
  const list = document.getElementById('cartList');
  list.innerHTML = '';
  let total = 0;
  cart.forEach(item => {
    const sub = item.price * item.qty;
    total += sub;
    const div = document.createElement('div');
    div.className = 'cart-item';
    div.innerHTML = `<span>${item.icon} ${item.name} × ${item.qty}</span><strong>¥${sub}</strong>`;
    list.appendChild(div);
  });
  document.getElementById('cartTotal').textContent = total.toLocaleString();
}

function completeCheckout(method) {
  isScanning = false;
  beep(880, 0.3);
  let total = cart.reduce((s, i) => s + (i.price * i.qty), 0);
  document.getElementById('successDetails').innerHTML = `おしはらい: <strong>${method}</strong><br>ごうけい: <strong style="color:#FF4081;font-size:30px;">¥${total.toLocaleString()}</strong>`;
  document.getElementById('cashierScreen').classList.remove('active');
  document.getElementById('successScreen').classList.add('active');
}

function nextCustomer() {
  cart = [];
  renderCart();
  isScanning = true;
  document.getElementById('successScreen').classList.remove('active');
  document.getElementById('cashierScreen').classList.add('active');
}

function clearCart() { cart = []; renderCart(); }

function openPrintSheet() {
  document.getElementById('printSheetModal').style.display = 'block';
  document.getElementById('print_card_aone').innerHTML = '';
  document.getElementById('print_qr_paypay').innerHTML = '';
  document.getElementById('print_qr_rakuten').innerHTML = '';
  new QRCode(document.getElementById('print_card_aone'), { text: 'PLAY:AONECARD', width: 90, height: 90 });
  new QRCode(document.getElementById('print_qr_paypay'), { text: 'PLAY:PAYPAY', width: 90, height: 90 });
  new QRCode(document.getElementById('print_qr_rakuten'), { text: 'PLAY:RAKUTEN', width: 90, height: 90 });
}
function closePrintSheet() { document.getElementById('printSheetModal').style.display = 'none'; }

// ページを開いたら自動スタート
window.onload = initBarcodeScanner;
</script>
</body>
</html>
